name: TikTok daily compilation (Top 5 GTA 6 moments)

on:
  schedule:
    # 12:00 and 19:00 Dublin (winter = UTC)
    - cron: '20 11,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtaivy-history
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build compilation
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python compile_tiktok.py
      - name: Publish as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp4 >/dev/null 2>&1; then
            TAG="tiktok-$(date -u +%Y%m%d-%H%M)-${{ github.run_id }}"
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            gh release create "$TAG" out/*.mp4 out/*.json --title "GTA_IVY TikTok compilation $(date -u '+%Y-%m-%d %H:%M UTC')" --notes "Top 5 compilation for TikTok."
          fi
      - name: Queue on TikTok via Buffer
        if: env.RELEASE_TAG != ''
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_SERVICES: tiktok
          QUEUE_MODE: shareNow
        run: python post_to_buffer.py
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/channels/GTAIVY/tiktok_compiled.txt data/channels/GTAIVY/seen_videos.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "TikTok compilation state [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main || true
