name: Scheduled Twitch to YouTube Shorts Automation

on:
  schedule:
    # GTA_IVY: 1 Short 30 min before each Buffer slot (9:00, 13:00, 17:00, 21:00 Dublin)
    - cron: '30 8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Run only this channel (leave empty to run ALL channels in parallel)'
        required: false
        default: ''
        type: string
      big:
        description: 'Force well-known-streamers mode (any value)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-automation:
    # Run all channels in parallel; each gets its own 6h job limit so none is starved.
    # If a single channel is requested via manual dispatch, run only that one.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        channel: ${{ fromJSON(inputs.channel && format('["{0}"]', inputs.channel) || '["GTAIVY"]') }}
    name: ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Shorts + Video Generation for ${{ matrix.channel }}
        env:
          CAPTION_BOTTOM_MARGIN: '0.21'
          FORCE_BIG_STREAMERS: ${{ inputs.big }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          # Channel dynamic tokens passed as environment variables:
          YOUTUBE_TOKEN_JSON_GTAIVY: ${{ secrets.YOUTUBE_TOKEN_JSON_GTAIVY }}
          # Facebook Page (Graph API) credentials for the FacebookGaming channel:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          # Notification Configuration Secrets
          NOTIFICATION_PROVIDER: ${{ secrets.NOTIFICATION_PROVIDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          USER_PHONE_NUMBER: ${{ secrets.USER_PHONE_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py --channels channels.json --channel "${{ matrix.channel }}"

      - name: Publish Shorts as a GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp4 >/dev/null 2>&1; then
            TAG="shorts-$(date -u +%Y%m%d-%H%M)-${{ github.run_id }}"
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            gh release create "$TAG" out/*.mp4 out/*.json --title "GTA_IVY Shorts $(date -u '+%Y-%m-%d %H:%M UTC')" --notes "Ready to post via Buffer. Credit is in each .json description."
          else
            echo "No new Shorts this run."
          fi

      - name: Queue Shorts on YouTube + X via Buffer (TikTok gets the daily compilation instead)
        if: env.RELEASE_TAG != ''
        env:
          BUFFER_SERVICES: youtube,twitter
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python post_to_buffer.py

      - name: Commit & Push Updated History (best-effort, retry on conflict)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          for i in 1 2 3 4 5; do
            find data/channels -type f \( -name "seen_videos.txt" -o -name "upload_log.json" -o -name "tweeted_youtube.txt" \) -exec git add {} +
            if git diff --cached --quiet; then
              echo "No history changes for ${{ matrix.channel }}"
              break
            fi
            git commit -m "auto: update ${{ matrix.channel }} history [skip ci]" || break
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort || true
            if git push origin main; then
              echo "Pushed ${{ matrix.channel }} history"
              break
            fi
            echo "Push conflict, retrying ($i)..."
            sleep 5
          done
