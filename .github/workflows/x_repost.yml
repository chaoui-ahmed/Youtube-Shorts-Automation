name: Re-post existing release videos via Buffer

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags (space-separated)'
        required: true
        type: string
      skip:
        description: 'mp4 names to skip (space-separated)'
        required: false
        default: ''
        type: string
      services:
        description: 'Buffer services (comma-separated)'
        required: false
        default: 'twitter'
        type: string
      x_mode:
        description: 'shareNow or addToQueue'
        required: false
        default: 'addToQueue'
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Post each release's Shorts on X via Buffer
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_SERVICES: ${{ inputs.services }}
          QUEUE_MODE: shareNow
          X_MODE: ${{ inputs.x_mode }}
          SKIP_FILES: ${{ inputs.skip }}
        run: |
          for TAG in ${{ inputs.tags }}; do
            rm -rf out && mkdir out
            gh release download "$TAG" --pattern "*.json" --dir out
            RELEASE_TAG="$TAG" python post_to_buffer.py
          done
